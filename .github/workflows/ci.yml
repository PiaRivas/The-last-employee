name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      # dotframe ships with the game's dependencies, so the CLI runs without a global install.
      - name: Golden replays
        working-directory: apps/game
        run: bunx dotframe replay verify replays/*.json
      - name: Build web
        working-directory: apps/game
        run: bunx dotframe build web
